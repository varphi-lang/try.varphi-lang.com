<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Varphi Turing Machine Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<script>
if (window.self !== window.top) {
    document.body.style.width = "100%";
    document.body.style.paddingTop = "0px";
    
    document.getElementById("machine_title").style.display = "none";
}
</script>
  <!-- External Libraries -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css" type="text/css" rel="stylesheet" >
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css" type="text/css" rel="stylesheet" >
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" type="text/css" rel="stylesheet" >
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/kineticjs/5.2.0/kinetic.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

  <style>
    body { width: 75%; margin-right: auto; margin-left: auto; padding-top: 20px; }
    @media (max-width: 1000px){ body { width: 90%; } }
    #editor_container { margin-left: auto; margin-right: auto; width: 70%; }
    @media (max-width: 1080px){ #editor_container { width: 100%; } }
    #machine_grid > div.column { height:10px!important; }
    #machine_grid { width: inherit; padding-left: 15px; padding-right: 15px; }
    #speed_bar { background: #2980b9; }
    #speed_column { margin-top: 10px; }
    #container { margin-top: 20px; padding-left: 0px; }
    #machine_segment { padding: 10px 0px 0px 0px; }
    .ui.header.accept { margin-top: 0px; }
    .CodeMirror { height: 400px; border: 1px solid #ddd; border-radius: 4px; }
    .cm-highlight-line { background-color: #ffdd33 !important; }
  </style>
</head>
<body>

<div class="ui segments" id="machine" style="display:none;">
  <div class="ui center aligned grey segment">
    <h2 class="ui header" id="machine_title">Varphi Simulation</h2>
  </div>
  
  <div class="ui segment" id="machine_segment">
    <div class="ui center aligned stackable grid" id="machine_grid">
      <div class="five wide center aligned column">
        <h4 class="ui header" id="counter_text">Steps: 0</h4>
      </div>
      <div class="six wide center aligned column" id="state_text_container">
        <h4 class="ui header" id="state_text">State: None</h4>
      </div>
      <div class="five wide center aligned column">
        <h4 class="ui green header accept" id="halted_text" style="display:none;">Halted</h4>
      </div>
    </div>
    <div id="container"></div>
  </div>

  <div class="ui segment">
    <div class="ui centered stackable grid">
      <div class="six wide center aligned column">
        <div class="ui labeled input fluid" style="margin-bottom: 10px;">
          <div class="ui label">Blank Char (Default: space)</div>
          <input type="text" id="blank_char_input" value=" " maxlength="1">
        </div>
        <div id="dynamic_tapes_container"></div>
        <button class="ui fluid button blue" id="load_input">Initialize Tapes</button>
      </div>

      <div class="four wide center aligned column">
        <div class="ui big icon buttons">
          <button class="ui button disabled" id="play"><i class="play icon"></i></button>
          <button class="ui button disabled" id="pause"><i class="pause icon"></i></button>
          <button class="ui button disabled" id="step"><i class="step forward icon"></i></button>
        </div>
      </div>      
      
      <div class="six wide center aligned column" id="speed_column">
        <div class="ui grid">
          <div class="four wide column"><h3 class="ui header">Speed:</h3></div>
          <div class="eleven wide center aligned column"><div id="speed_bar"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="ui negative message" style="display: none;" id="log_container">
  <i class="close icon"></i>
  <div id="log"></div>
</div>

<div class="ui centered stackable grid">
  <div class="sixteen wide column">
    <div class="ui segment" style="padding:0" id="editor_container">
      <textarea id="code_editor"></textarea>
      <button id="loader" class="ui bottom attached green fluid button disabled">
        <i class="circle notch loading icon"></i> Initializing Varphi Compiler...
      </button>
    </div>
  </div>
</div>

<script>

function letter_box(sq_size, pos_x, pos_y){
    this.square = new Kinetic.Rect({ x: pos_x, y: pos_y, width: sq_size, height: sq_size, fill: "#428bca", stroke: 'white' });
    this.symbol = new Kinetic.Text({ x: pos_x, y: pos_y + sq_size/6, fill: "white", text: "", fontSize: 2 * sq_size/3, fontFamily: 'Helvetica', height: sq_size, width: sq_size, align: 'center' });
}

function cinta(pos_y, n_cells, sq_size) {
    this.n_cells = n_cells;
    this.sq_size = sq_size;
    this.square_group = new Kinetic.Group({});
    this.symbol_group = new Kinetic.Group({});

    for(var i = 0; i < n_cells; i++){
        var l_box = new letter_box(sq_size, sq_size * (i-1), pos_y);
        this.symbol_group.add(l_box.symbol);
        this.square_group.add(l_box.square);
    }

    this.get_square_group = function() { return this.square_group; }
    this.get_symbol_group = function() { return this.symbol_group; }

    this.sync = function(tapeData, blankChar) {
        var middle = Math.floor(this.n_cells / 2);
        
        for (var b = 0; b < this.n_cells; b++) {
            // Find where this cell sits relative to the head's position in the string
            var string_idx = tapeData.head_position + (b - middle);
            var char = blankChar;
            
            // If the calculated index falls inside our string length, grab the character
            if (string_idx >= 0 && string_idx < tapeData.string.length) {
                char = tapeData.string.charAt(string_idx);
            }
            
            this.symbol_group.getChildren()[b].setText(char);
        }
    }
}


let pyodide, session;
let myCodeMirror, stage, layer;
let tapes = [];
let n_tapes = 1;
let total_width, sq_size, ncells;
let step_counter = 0;
let playInterval;
let pause = true;
let trans_speed = 1000;
let input_loaded = false;
let currentHighlight = null;


$(document).ready(function() {
    myCodeMirror = CodeMirror.fromTextArea(document.getElementById('code_editor'), {
        mode: "text/html", lineNumbers: true
    });
    myCodeMirror.setValue("// Start writing Varphi code here...\ns0 (a) s1 (b) (RIGHT)");

    total_width = document.body.offsetWidth > 1080 ? document.getElementById('editor_container').offsetWidth : document.body.offsetWidth * 0.9;
    ncells = document.body.offsetWidth > 720 ? 25 : 17;

    stage = new Kinetic.Stage({ container: "container", width: total_width, height: 0 });
    layer = new Kinetic.Layer();
    stage.add(layer);

    let speed_bar = document.getElementById('speed_bar');
    noUiSlider.create(speed_bar, {
        start: [50], step: 1, range: { 'min': 0, 'max': 100 }, connect: "lower",
    });
    speed_bar.noUiSlider.on('slide', function() {
        trans_speed = (100 - speed_bar.noUiSlider.get()) * 15; 
    });

    $('.message .close').on('click', function() { $(this).closest('.message').slideUp(250); });
});


async function initPyodideEnv() {
    try {
        pyodide = await loadPyodide();
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        
        await micropip.install(["vp2web"]);
        
        pyodide.runPython("from vp2web import session");
        session = pyodide.globals.get("session");
        
        $('#loader').removeClass('disabled').html('Compile Varphi');
    } catch (err) {
        $('#loader').addClass('red disabled').text('Failed to load Pyodide');
        showError("Failed to initialize python environment: " + err);
    }
}


$('#loader').click(function() {
    $('#log_container').slideUp();
    const code = myCodeMirror.getValue();
    const result = JSON.parse(session.compile(code));

    if (result.success) {
        n_tapes = result.k;
        let inputsHtml = "";
        for (let i = 0; i < n_tapes; i++) {
            inputsHtml += `<div class="ui fluid input" style="margin-bottom: 5px;">
                <input type="text" id="tape_input_${i}" placeholder="Tape ${i+1} Initial Value (Leave empty for BLANK)">
            </div>`;
        }
        $('#dynamic_tapes_container').html(inputsHtml);
        
        $('#machine').slideDown();
        loadStage();
    } else {
        showError("<strong>Compilation Error</strong>: " + result.error);
    }
});


$('#load_input').click(function() {
    const blankChar = $('#blank_char_input').val() || " ";
    let inputs = [];
    for (let i = 0; i < n_tapes; i++) {
        inputs.push($(`#tape_input_${i}`).val() || "");
    }
    
    const pyInputs = pyodide.toPy(inputs);
    const result = JSON.parse(session.init_machine(pyInputs, blankChar));
    pyInputs.destroy();

    if (result.error) {
        showError(result.error);
        return;
    }

    input_loaded = true;
    step_counter = 0;
    $('#counter_text').text("Steps: 0");
    $('#halted_text').hide();
    
    enableButtons();
    updateUI(result, blankChar);
});


$('#play').click(function() {
    if (!input_loaded || !pause) return;
    pause = false;
    $('#play').addClass('disabled');
    $('#pause').removeClass('disabled');
    
    function loop() {
        if (pause) return;
        stepMachine();
        setTimeout(loop, trans_speed);
    }
    setTimeout(loop, 0);
});

$('#pause').click(function() {
    pause = true;
    $('#play').removeClass('disabled');
    $('#pause').addClass('disabled');
});

$('#step').click(function() {
    if (!input_loaded) return;
    pause = true;
    $('#play').removeClass('disabled');
    $('#pause').addClass('disabled');
    stepMachine();
});


function stepMachine() {
    const result = JSON.parse(session.step());
    step_counter++;
    $('#counter_text').text("Steps: " + step_counter);
    updateUI(result, $('#blank_char_input').val() || " ");
}

function updateUI(data, blankChar) {
    $('#state_text').text("State: " + data.state);
    
    for (let i = 0; i < n_tapes; i++) {
        tapes[i].sync(data.tapes[i], blankChar);
    }
    layer.draw();

    
    if (currentHighlight !== null) {
        try {
            myCodeMirror.removeLineClass(currentHighlight, 'background', 'cm-highlight-line');
        } catch (e) {
            
        }
        currentHighlight = null;
    }
    
    
    if (data.line_number !== null && data.line_number !== undefined) {
        let lineIdx = data.line_number - 1; 
        
        
        if (lineIdx >= 0 && lineIdx < myCodeMirror.lineCount()) {
            
            currentHighlight = myCodeMirror.addLineClass(lineIdx, 'background', 'cm-highlight-line');
            
            
            let localCoords = myCodeMirror.charCoords({line: lineIdx, ch: 0}, "local");
            let halfEditorHeight = myCodeMirror.getScrollerElement().offsetHeight / 2;
            myCodeMirror.scrollTo(null, localCoords.top - halfEditorHeight);
        }
    }

    if (data.halted) {
        pause = true;
        disableButtons();
        $('#halted_text').text("Halted at " + data.state).show();
    }
}


function loadStage() {
    stage.clear();
    layer.destroyChildren();
    
    sq_size = total_width / (ncells - 2);
    let total_height = Math.floor(1.6 * sq_size * n_tapes + sq_size / 2);
    stage.setHeight(total_height);
    
    tapes = [];
    let pos_x = total_width / 2;

    for(let j = 0; j < n_tapes; j++) {
        
        tapes[j] = new cinta((1.6 * j + 0.33) * sq_size, ncells, sq_size);
        let pos_y = (1.6 * j + 1.33) * sq_size - sq_size/6;
        
        let poly = new Kinetic.RegularPolygon({
          x: pos_x, y: pos_y + 2*sq_size/5, sides: 3, radius: sq_size/3, fill: "#000", stroke: "#fff", strokeWidth: 2
        });
        
        layer.add(tapes[j].get_square_group());
        layer.add(poly); 
        layer.add(tapes[j].get_symbol_group());
    }
    stage.add(layer);
    layer.draw();
}

function enableButtons() {
    $("#play, #step").removeClass('disabled');
    $("#pause").addClass('disabled');
}
function disableButtons() {
    $("#play, #pause, #step").addClass('disabled');
}
function showError(msg) {
    $("#log").html(msg);
    $("#log_container").slideDown();
}


initPyodideEnv();
</script>
</body>
</html>
